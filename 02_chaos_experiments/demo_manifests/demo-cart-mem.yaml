
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: cart-mem-ramp
  namespace: default
spec:
  entry: ramp
  templates:
    - name: ramp
      templateType: Serial
      deadline: 13m
      children:
        - mem-stage-1
        - mem-stage-2
        - mem-stage-3
        - mem-stage-4
    - name: mem-stage-1
      templateType: StressChaos
      deadline: 3m
      stressChaos:
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-cart-service
        stressors:
          memory:
            workers: 1
            size: '96MB'
    - name: mem-stage-2
      templateType: StressChaos
      deadline: 3m
      stressChaos:
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-cart-service
        stressors:
          memory:
            workers: 1
            size: '144MB'
    - name: mem-stage-3
      templateType: StressChaos
      deadline: 3m
      stressChaos:
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-cart-service
        stressors:
          memory:
            workers: 1
            size: '192MB'
    - name: mem-stage-4
      templateType: StressChaos
      deadline: 3m
      stressChaos:
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-cart-service
        stressors:
          memory:
            workers: 1
            size: '224MB'
            oomScoreAdj: -1000
