apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cart-mem-stress
  namespace: default
spec:
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: stylehub-cart-service
  stressors:
    memory:
      workers: 1
      size: '300MB'
  duration: '5m'
