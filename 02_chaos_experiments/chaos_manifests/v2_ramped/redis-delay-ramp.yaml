# v2 ramped fault: progressive network latency on redis — the gradual-onset
# version of the verified 3-hop cascade (redis -> cart -> checkout -> frontend),
# and the richest lead-time scenario in the suite.
#
# cart's redis client uses socket_timeout=2s, and EVERY cart operation touches
# redis, so the ramp propagates through three graph hops in order:
#   stages 1-2 (150/400ms): cart latency rises on every endpoint; no errors —
#     the earliest and cleanest precursor;
#   stage 3 (900ms): checkout's 2s budget for its cart call starts straining
#     (cart still answers, slowly) — second-hop latency precursor;
#   stage 4 (1600ms +/- 250ms jitter): redis ops intermittently cross 2s, cart
#     answers 503 "redis unavailable (TimeoutError)", checkout answers 502,
#     frontend shows the order-failed page — the full verified cascade, arrived
#     at gradually instead of by a kill.
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: redis-delay-ramp
  namespace: default
spec:
  entry: ramp
  templates:
    - name: ramp
      templateType: Serial
      deadline: 21m
      children:
        - rdelay-stage-1
        - rdelay-stage-2
        - rdelay-stage-3
        - rdelay-stage-4
    - name: rdelay-stage-1
      templateType: NetworkChaos
      deadline: 5m
      networkChaos:
        action: delay
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-redis
        delay:
          latency: '150ms'
          jitter: '30ms'
          correlation: '25'
    - name: rdelay-stage-2
      templateType: NetworkChaos
      deadline: 5m
      networkChaos:
        action: delay
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-redis
        delay:
          latency: '400ms'
          jitter: '60ms'
          correlation: '25'
    - name: rdelay-stage-3
      templateType: NetworkChaos
      deadline: 5m
      networkChaos:
        action: delay
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-redis
        delay:
          latency: '900ms'
          jitter: '120ms'
          correlation: '25'
    - name: rdelay-stage-4
      templateType: NetworkChaos
      deadline: 5m
      networkChaos:
        action: delay
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-redis
        delay:
          latency: '1600ms'
          jitter: '250ms'
          correlation: '25'
