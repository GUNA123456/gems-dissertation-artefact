# v2 ramped fault: progressive network latency on payment-service.
#
# This is the suite's PURE LATENCY-SLO scenario: order latency degrades ~44x
# (50ms -> 2.2s) across four stages while every order still returns HTTP 200 and
# no error counter ever moves. That makes it the hardest and most honest
# lead-time test in the set — the model has to predict an SLO breach from
# degradation alone, with no error signal available to shortcut on. Pair it with
# redis-delay-ramp, which is the latency-that-becomes-errors counterpart.
#
# Measured response (median order latency, checkout API, 4 samples per stage):
#   baseline  50ms | 100ms -> 0.27s | 300ms -> 0.69s | 800ms -> 1.67s
#   1100ms -> 2.23s.  An HTTP call to a delayed pod costs ~2.0x the injected
#   delay, because both the handshake and the response traverse netem.
#
# Why stage 4 stops at 1100ms, and why there is deliberately no error stage —
# both constraints were measured, not assumed:
#   * requests' scalar `timeout=2` applies to the connect and read phases
#     SEPARATELY, not to total elapsed time. A call spending 1.1s connecting and
#     1.1s reading takes 2.2s and breaches neither limit. Producing a real
#     ReadTimeout therefore needs >2.0s of injected delay.
#   * payment's liveness probe (timeoutSeconds: 3) starts failing above ~1.36s
#     of delay. A first draft used 1500ms and Kubernetes killed the pod mid-ramp
#     ("Liveness probe failed: context deadline exceeded"), so the terminal
#     failure arrived as ConnectionError from a restart rather than ReadTimeout
#     from latency — the label would have said "delay" while the cluster did
#     something else entirely.
# Those two windows do not overlap: >2.0s to time out, <1.36s to survive the
# probe. Rather than raise probe timeouts purely to manufacture an error, this
# workflow stays a clean latency scenario. If an error-terminated payment
# cascade is wanted later, raise the liveness timeoutSeconds to ~8s in
# values.yaml FIRST and then extend the ramp to 2500ms.
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: payment-delay-ramp
  namespace: default
spec:
  entry: ramp
  templates:
    - name: ramp
      templateType: Serial
      deadline: 21m
      children:
        - delay-stage-1
        - delay-stage-2
        - delay-stage-3
        - delay-stage-4
    - name: delay-stage-1
      templateType: NetworkChaos
      deadline: 5m
      networkChaos:
        action: delay
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-payment-service
        delay:
          latency: '100ms'
          jitter: '20ms'
          correlation: '25'
    - name: delay-stage-2
      templateType: NetworkChaos
      deadline: 5m
      networkChaos:
        action: delay
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-payment-service
        delay:
          latency: '300ms'
          jitter: '50ms'
          correlation: '25'
    - name: delay-stage-3
      templateType: NetworkChaos
      deadline: 5m
      networkChaos:
        action: delay
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-payment-service
        delay:
          latency: '800ms'
          jitter: '100ms'
          correlation: '25'
    - name: delay-stage-4
      templateType: NetworkChaos
      deadline: 5m
      networkChaos:
        action: delay
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-payment-service
        delay:
          latency: '1100ms'
          jitter: '80ms'
          correlation: '25'
