# NIGHT-B LIGHT VARIANT of cart-mem-ramp.yaml — generated by make_nightb_variants.py
# v2 ramped fault: progressive memory pressure on cart-service, ending past the
# 256Mi container limit — the defined OOM failure mode the limits were set for.
#
# Stages climb 96 -> 144 -> 192 -> 224 MB of stress on top of the app's own RSS,
# so container_memory_working_set_bytes rises monotonically for ~15 minutes
# (the precursor) before the cgroup crosses 256Mi in the terminal stage.
#
# Honest nuance, verified rather than assumed: when the cgroup hits its limit the
# kernel OOM-kills the LARGEST task in it. That may be the stress-ng worker
# rather than the uvicorn process — in which case the pod does NOT restart and
# the signature is sustained near-limit memory with the stress respawning, not a
# container restart. Both outcomes are usable labels; the collection pipeline
# must not assume restart_count is the only OOM signal.
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: cart-mem-ramp-light
  namespace: default
spec:
  entry: ramp
  templates:
    - name: ramp
      templateType: Serial
      deadline: 21m
      children:
        - mem-stage-1
        - mem-stage-2
        - mem-stage-3
        - mem-stage-4
    - name: mem-stage-1
      templateType: StressChaos
      deadline: 5m
      stressChaos:
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-cart-service
        stressors:
          memory:
            workers: 1
            size: '48MB'
    - name: mem-stage-2
      templateType: StressChaos
      deadline: 5m
      stressChaos:
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-cart-service
        stressors:
          memory:
            workers: 1
            size: '72MB'
    - name: mem-stage-3
      templateType: StressChaos
      deadline: 5m
      stressChaos:
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-cart-service
        stressors:
          memory:
            workers: 1
            size: '96MB'
    - name: mem-stage-4
      templateType: StressChaos
      deadline: 5m
      stressChaos:
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: stylehub-cart-service
        stressors:
          memory:
            workers: 1
            size: '112MB'
