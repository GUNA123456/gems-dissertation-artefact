# Default values for StyleHub Microservices Helm Chart

replicaCount: 1

image:
  repositoryPrefix: stylehub
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  frontendType: NodePort
  frontendNodePort: 30080

redis:
  image: redis:7-alpine
  port: 6379
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

microservices:
  frontend:
    port: 8080
  productCatalog:
    port: 8081
  cart:
    port: 8082
  currency:
    port: 8083
  recommendation:
    port: 8084
  shipping:
    port: 8085
  checkout:
    port: 8086
  ad:
    port: 8087
  email:
    port: 8088
  payment:
    port: 8089

# OpenTelemetry: when set (e.g. http://jaeger-collector.monitoring.svc:4318), every
# service exports traces there. Empty = tracing disabled; images behave identically.
otel:
  endpoint: ""

# replicaCount stays 1 DELIBERATELY (documented design decision, not an omission): a
# single replica means a killed or degraded pod is VISIBLE as a failure instead of being
# absorbed by siblings — the research requires observable failure, not availability.

# Shared per-service resources. Requests keep the scheduler honest on a small node;
# the MEMORY limit gives memory-stress chaos a defined failure mode (OOMKill at 256Mi)
# instead of undefined node-level contention. CPU limits are deliberately omitted —
# they throttle rather than fail, which blurs cascade signatures.
resources:
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    memory: 256Mi

probes:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
