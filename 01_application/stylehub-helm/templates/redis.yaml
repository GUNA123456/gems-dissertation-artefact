apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    app: {{ .Release.Name }}-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-redis
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.redis.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            # Without an explicit timeout these probes default to 1s, and under
            # redis-delay chaos the SYN-ACK alone takes ~1.6-1.85s — the probe
            # killed a healthy redis 4 times during delay smoke tests, converting
            # a latency fault into a restart fault (same trap as payment's ramp).
            # 3s clears worst-case handshake delay while still catching a hang.
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.redis.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
          ports:
            - containerPort: {{ .Values.redis.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-redis
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
