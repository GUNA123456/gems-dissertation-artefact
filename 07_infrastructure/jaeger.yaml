# Jaeger all-in-one: collector (OTLP) + query UI + in-memory storage. Deliberately the
# lightest deployment that works — traces are ground truth and demo material, not the
# model's input, so durable trace storage is not required.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels: {app: jaeger}
spec:
  replicas: 1
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
            - {name: MEMORY_MAX_TRACES, value: "20000"}
          ports:
            - {containerPort: 4318}   # OTLP http
            - {containerPort: 16686}  # UI
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
spec:
  selector: {app: jaeger}
  ports:
    - {name: otlp-http, port: 4318, targetPort: 4318}
    - {name: ui, port: 16686, targetPort: 16686}
