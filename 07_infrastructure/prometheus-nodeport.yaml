# Stable external access to Prometheus on :30900.
#
# Why this exists as a standalone Service rather than a value on the Helm
# release: the prometheus-community/prometheus chart (29.24.0) exposes
# server.service.type and server.service.servicePort but NO nodePort key, so
# asking Helm for a NodePort yields a randomly-assigned port, not 30900.
#
# The original 30900 was applied by hand onto the chart's own
# `prometheus-server` Service. That worked until the first `helm upgrade`
# (2026-08-18, retention 5d -> 21d), which reconciled that Service back to the
# chart default of ClusterIP and silently removed the NodePort — breaking
# `--prom http://localhost:30900` for the live monitor and the demo URLs, while
# Prometheus itself stayed perfectly healthy. No data was affected.
#
# A separate Service is not owned by the release, so Helm never reconciles it
# away. Selector matches the chart's server pod labels (verified against the
# running pod, not assumed).
apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: server
    gems.research/purpose: stable-external-access
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30900
      protocol: TCP
